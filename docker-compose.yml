services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: api_sentinel
      POSTGRES_USER: api_sentinel
      POSTGRES_PASSWORD: api_sentinel
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_sentinel -d api_sentinel"]
      interval: 5s
      timeout: 3s
      retries: 10
